*{box-sizing:border-box}body{margin:0;background:#121b35;color:var(--ink);font:16px/1.55 Monocraft,monospace}button,input,select{font:inherit;color:inherit}button{background:none;border:0;border-bottom:1px solid var(--line);padding:12px;text-align:left;cursor:pointer;min-height:46px}button:hover{background:#293961}button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}button[disabled]{opacity:.5;cursor:default}button strong{display:block;font-weight:normal}button small{color:var(--muted);font-size:13px;display:block;margin-top:5px}button.primary{background:var(--pink);color:#1d2b53;border:0}button.primary:hover{background:#ffb1c9}button.chosen{box-shadow:inset 4px 0 var(--yellow)}a{color:var(--ink)}.study{max-width:1060px;margin:auto;padding:14px 20px;display:flex;align-items:center;gap:14px;justify-content:space-between;font:13px/1.5 monospace;color:var(--muted)}.study a{white-space:nowrap}.app{max-width:1000px;margin:0 auto 24px;background:var(--bg);min-height:690px;padding:24px}.top{display:flex;gap:14px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:14px}.brand{color:var(--pink);font-size:18px}.title{font-size:22px;margin:6px 0 0;line-height:1.4;font-weight:normal}.status{font-size:12px;color:var(--muted);text-align:right}.body{padding-top:22px}.lead{color:var(--muted);font-size:15px;margin:6px 0 20px}.starts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.start{padding:0 0 14px;border:0}.start .copy{padding:14px 12px 0}.start canvas{display:block;width:100%;height:auto;image-rendering:pixelated;background:#172042}.start strong{font-size:18px}.work{display:grid;grid-template-columns:minmax(250px,1fr) 288px;gap:24px}.stage{min-width:0}.canvas-wrap{background:#101a2d;display:flex;justify-content:center;align-items:center;min-height:256px;position:relative}.game{display:block;width:384px;max-width:100%;height:auto;image-rendering:pixelated;touch-action:none}.scene-note{display:flex;justify-content:space-between;gap:8px;color:var(--muted);font-size:12px;margin:10px 0}.quick{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.quick button{flex:1;white-space:nowrap;text-align:center}.elements{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.elements button{padding:6px 10px;min-height:38px;font-size:13px}.panel h2{font-size:20px;font-weight:normal;margin:0 0 6px}.panel .desc{font-size:13px;color:var(--muted);margin-bottom:14px}.stack{display:flex;flex-direction:column;gap:4px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row button{flex:1}.tag{font-size:12px;color:var(--yellow);margin-bottom:8px}.field{display:block;margin:12px 0}.field span{display:block;color:var(--muted);font-size:13px;margin-bottom:7px}select,input{width:100%;background:#172343;border:1px solid var(--line);padding:10px;min-height:44px}input[type=range]{padding:0;accent-color:var(--pink)}.rule{padding:12px 0;border-top:1px solid var(--line);font-size:14px}.rule em{font-style:normal;color:var(--pink);display:block;margin-bottom:4px}.rule small{display:block;color:var(--muted);font-size:12px;margin-top:6px}.hints{display:flex;gap:16px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:15px;margin-top:24px;font-size:12px;color:var(--muted)}kbd{color:var(--yellow);font:inherit}.toast{min-height:25px;color:var(--green);font-size:13px;margin-top:15px}.paint{display:grid;grid-template-columns:repeat(8,1fr);width:256px;max-width:100%;margin:20px auto;gap:1px;background:#536386}.paint button{padding:0;aspect-ratio:1;min-height:0;border:0}.paint button:focus{outline:2px solid var(--yellow);outline-offset:-2px;z-index:1}.swatches{display:flex;justify-content:center;gap:10px;margin:12px 0}.swatches button{width:44px;height:44px;border:2px solid transparent;padding:0}.swatches button[aria-pressed=true]{border-color:var(--yellow)}.formwide{max-width:600px;margin:auto}.formwide h2{font-weight:normal;font-size:22px}.mocknote{font-size:13px;color:var(--muted);margin:10px 0}.controls{display:flex;flex-wrap:wrap;gap:8px}.controls button{text-align:center;flex:1}.win{color:var(--yellow)}.back{font-size:14px}.summary{font-size:14px;padding:14px 0}.artifact{max-width:1000px;margin:0 auto 24px;padding:0 20px;color:var(--muted);font:13px/1.6 monospace}
@media(min-width:1100px){.app{padding:28px 36px}.work{grid-template-columns:1fr 300px}.game{width:512px}}

<body>
<div class="study"><span>INTERACTION STUDY · 08 OCT 2026<br>Proposed screens · not the Android app</span><a href="README.md">Scope &amp; review</a></div>
<main class="app" id="app"></main>
<div class="artifact">Keyboard: arrows navigate, Enter confirms, Escape goes back, F5 opens the simulated Test, U undoes. Buttons and touch use the same actions. No gamepad or official PICO-8 connection in this study. Sound stays off.</div>
<script>
(() => {
'use strict';
const app=document.getElementById('app');
const C={'.':'#1d2b53','0':'#000000','1':'#1d2b53','3':'#008751','4':'#ab5236','5':'#5f574f','6':'#c2c3c7','7':'#fff1e8','8':'#ff004d','9':'#ffa300','a':'#ffec27','b':'#00e436','c':'#29adff','d':'#83769c','e':'#ff77a8','f':'#ffccaa'};
const art={moth:['..7..7..','.77..77.','7e7777e7','77e77e77','.777777.','..7dd7..','..7..7..','........'],star:['...aa...','...aa...','.aaaaaa.','..aaaa..','..aaaa..','.aa..aa.','........','........'],light:['..6666..','.677776.','67777776','677aa776','677aa776','67777776','.677776.','..6666..']};
let project=null,selected=null,screen='home',draft=null,backScreen='scene',notice='',paintColor='e',history=[],testing=null,moveOrigin=null,lastRendered=null;
const clone=v=>JSON.parse(JSON.stringify(v));
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const button=(label,action,extra='')=>`<button data-action="${action}" ${extra}>${label}</button>`;
const current=()=>project?.items.find(x=>x.id===selected);
function save(label){history.push(clone(project));notice=label+' · Undo available';}
function fresh(kind){history=[];project={kind,name:kind==='explorer'?'Little explorer':kind==='puzzle'?'Light puzzle':'New game',items:[],movement:false,rules:false,sound:false,speed:2,color:'e',moverId:null,collectId:null,targetId:null};if(kind==='explorer'){project.items=[{id:1,name:'Moth',type:'moth',x:28,y:72,pixels:art.moth},{id:2,name:'Star',type:'star',x:94,y:44,pixels:art.star}];project.movement=true;project.rules=true;project.moverId=1;project.collectId=2;project.targetId=1;}if(kind==='puzzle'){project.items=[0,1,2].map((n)=>({id:n+1,name:'Light '+(n+1),type:'light',group:'lights',x:28+n*28,y:60,pixels:art.light,on:n===1}));project.rules=true;}selected=project.items[0]?.id??null;screen='scene';notice=kind==='blank'?'An empty game. Add something of your own.':'Ready to try. Every part can be changed.';render();}
function header(title){return `<header class="top"><div><div class="brand">PikoNest / Workshop</div><h1 class="title">${esc(title)}</h1></div><div class="status">Design prototype<br>${draft?'Draft in this demo':project?'Demo state only':'Choose a starting point'}</div></header>`;}
function shell(content,title){const focused=document.activeElement?.dataset.action;app.innerHTML=header(title)+`<div class="body">${content}</div><div class="toast" role="status" aria-live="polite">${esc(notice)}</div><footer class="hints"><span><kbd>A</kbd> ${screen==='paint'?'Paint':'Select'}</span><span><kbd>B</kbd> Back</span><span><kbd>Start</kbd> Test</span><span><kbd>Select</kbd> Actions</span></footer>`;wire();fitCanvas();if(lastRendered!==screen){window.scrollTo(0,0);lastRendered=screen;}const choices=[...app.querySelectorAll('button:not([disabled]),select,input')];(choices.find(b=>focused&&b.dataset.action===focused)||choices[0])?.focus({preventScroll:true});}
const glyphs={A:['010','101','111','101','101'],B:['110','101','110','101','110'],C:['011','100','100','100','011'],D:['110','101','101','101','110'],E:['111','100','110','100','111'],F:['111','100','110','100','100'],G:['011','100','101','101','011'],H:['101','101','111','101','101'],I:['111','010','010','010','111'],J:['001','001','001','101','010'],K:['101','101','110','101','101'],L:['100','100','100','100','111'],M:['101','111','111','101','101'],N:['101','111','111','111','101'],O:['010','101','101','101','010'],P:['110','101','110','100','100'],Q:['010','101','101','111','011'],R:['110','101','110','101','101'],S:['011','100','010','001','110'],T:['111','010','010','010','010'],U:['101','101','101','101','111'],V:['101','101','101','101','010'],W:['101','101','111','111','101'],X:['101','101','010','101','101'],Y:['101','101','010','010','010'],Z:['111','001','010','100','111'],'!':['010','010','010','000','010']};
function pixelText(g,text,x,y){[...text].forEach((c,n)=>(glyphs[c]||[]).forEach((row,j)=>[...row].forEach((v,i)=>{if(v==='1')g.fillRect(x+n*4+i,y+j,1,1);})));}
function fitCanvas(){const c=document.getElementById('game');if(c)c.style.width=Math.min(512,Math.max(128,Math.floor(c.parentElement.clientWidth/128)*128))+'px';}
window.addEventListener('resize',fitCanvas);
function drawPixels(ctx,pixels,x,y,scale=1){pixels.forEach((r,j)=>[...r].forEach((v,i)=>{if(v!=='.'){ctx.fillStyle=C[v]||C.e;ctx.fillRect(x+i*scale,y+j*scale,scale,scale);}}));}
function drawScene(canvas,p,sel,play){const g=canvas.getContext('2d');g.imageSmoothingEnabled=false;g.fillStyle=C['1'];g.fillRect(0,0,128,128);const rect=(x,y,w,h,c)=>{g.fillStyle=C[c];g.fillRect(x,y,w,h);};
 if(p.kind==='explorer'){rect(0,0,128,128,'3');rect(0,0,128,23,'1');for(let i=0;i<24;i++){let x=(i*37+7)%126,y=28+(i*19)%96;rect(x,y,1,3,'b');if(i%3===0){rect(x-1,y-2,3,2,'e');rect(x,y-3,1,1,'a');}}rect(46,29,20,76,'4');rect(26,41,67,14,'4');for(let i=0;i<10;i++)rect(49+(i*3)%14,31+i*7,2,1,'9');rect(80,78,31,22,'c');rect(84,82,23,2,'7');rect(93,90,11,1,'7');rect(12,104,25,8,'5');rect(16,100,16,5,'6');}
 else if(p.kind==='puzzle'){for(let x=8;x<128;x+=16)for(let y=24;y<128;y+=16)rect(x,y,1,1,'d');rect(12,45,104,41,'5');rect(12,43,104,2,'d');}
 else {for(let x=8;x<128;x+=8)for(let y=8;y<128;y+=8)rect(x,y,1,1,'5');}
 p.items.forEach((it,i)=>{if(play?.collected&&it.id===p.collectId)return;let x=it.x,y=it.y;if(play&&it.id===p.moverId&&p.kind!=='puzzle'){x=play.x;y=play.y;}let pixels=it.pixels;if(it.type==='light'){const on=play?play.lights[i]:it.on;pixels=it.pixels.map(r=>r.replace(/[7a]/g,c=>on?'a':c==='7'?'d':'5'));}drawPixels(g,pixels,x-4,y-4,1);if(!play&&it.id===sel){g.strokeStyle=C.a;g.lineWidth=1;g.strokeRect(x-7.5,y-7.5,15,15);}if(play&&p.kind==='puzzle'&&play.index===i){rect(x-4,y+9,8,2,'e');}});
 g.fillStyle=C['7'];if(p.kind==='explorer')pixelText(g,play?.won?'YOU DID IT!':'FIND THE STAR',8,9);if(p.kind==='puzzle')pixelText(g,play?.won?'ALL LIT!':'LIGHT EVERY LANTERN',10,12);if(!p.items.length){g.fillStyle=C['6'];pixelText(g,'YOUR GAME STARTS HERE',11,57);}
}
function render(){
 if(screen==='home'){shell(`<p class="lead">Start with an idea. Make it yours.</p><div class="starts">${[['blank','Blank project','An empty game. Add your own pieces.'],['explorer','Little explorer','Move, collect, reach a goal.'],['puzzle','Light puzzle','Select lights. Make them all glow.']].map(([k,t,d])=>`<button class="start" data-action="new:${k}"><canvas data-cover="${k}" width="128" height="128" aria-label="${t} illustration"></canvas><span class="copy"><strong>${t}</strong><small>${d}</small></span></button>`).join('')}</div><p class="mocknote">Make every part your own.</p>`,'Create a game');document.querySelectorAll('[data-cover]').forEach(c=>{let k=c.dataset.cover;drawScene(c,{kind:k,items:k==='blank'?[]:k==='explorer'?[{id:1,type:'moth',x:28,y:72,pixels:art.moth},{id:2,type:'star',x:94,y:44,pixels:art.star}]:[0,1,2].map((n)=>({id:n,type:'light',x:28+n*28,y:60,pixels:art.light,on:n!==1}))},null,null);});return;}
 if(screen==='paint'){shell(`<div class="formwide"><div class="tag">APPEARANCE / ${draft.add?'NEW SPRITE':esc(current().name)}</div><h2>Make it yours</h2><p class="lead">Choose a colour and paint. Done returns to your game.</p><div class="paint" aria-label="8 by 8 sprite">${draft.pixels.flatMap((r,y)=>[...r].map((v,x)=>`<button data-pixel="${x},${y}" style="background:${C[v]}" aria-label="Pixel ${x+1}, ${y+1}"></button>`)).join('')}</div><div class="swatches">${[['e','Pink'],['a','Yellow'],['7','Cream'],['c','Blue'],['.','Erase']].map(([c,n])=>`<button data-action="color:${c}" style="background:${C[c]}" aria-label="${n}" aria-pressed="${c===paintColor}">${c==='.'?'×':''}</button>`).join('')}</div><div class="row">${button('Cancel','cancel')}${button('Done','paintDone','class="primary"')}</div></div>`,project.name);return;}
 if(screen==='behavior'){shell(`<div class="formwide"><div class="tag">${esc(current().name)} / BEHAVIOR</div><h2>Move with directions</h2><p class="lead">Hold a direction to move this element.</p><label class="field"><span>Speed</span><input id="speed" type="range" min="1" max="4" value="${draft.speed}"></label><p id="speedValue">${['','Slow','Steady','Quick','Very quick'][draft.speed]}</p><p class="mocknote">Position and input are connected for you.</p><div class="row">${button('Cancel','cancel')}${button('Done','behaviorDone','class="primary"')}</div></div>`,project.name);return;}
 if(screen==='rules'){const puzzle=project.kind==='puzzle';shell(`<div class="formwide"><div class="tag">${esc(current()?.name||'Game')} / RULES</div><h2>${puzzle?'Turn a light on':'Make something happen'}</h2><label class="field"><span>When</span><select id="event"><option>${puzzle?'Game action ○ is pressed':'This item overlaps'}</option></select></label><label class="field"><span>${puzzle?'Which light':'With'}</span><select id="target">${puzzle?'<option>The selected light</option>':project.items.filter(i=>i.id!==selected).map(i=>`<option value="${i.id}" ${draft.target===i.id?'selected':''}>${esc(i.name)}</option>`).join('')||'<option>Add another element first</option>'}</select></label><div class="rule"><em>Do</em>${puzzle?'Toggle the selected light':'Hide this item'}<small>${puzzle?'Once per press. Holding will not repeat.':'Once when the overlap begins.'}</small></div><div class="rule"><em>Then</em>${puzzle?'When all lights are on → show “All lit!”':'Show “You did it!”'}</div><p class="mocknote">This study shows one rule recipe per example. The planned editor allows other events and ordered actions.</p><div class="row">${button('Cancel','cancel')}${button('Done','ruleDone','class="primary" '+(!puzzle&&project.items.length<2?'disabled':''))}</div></div>`,project.name);return;}
 if(screen==='conflict'){shell(`<div class="formwide"><div class="tag">SHARED APPEARANCE</div><h2>These lights share a sprite</h2><p class="lead">Change all lights together, or give this one its own appearance.</p><div class="stack">${button('Change all lights<small>Keep the shared appearance</small>','sharedAll')}${button('Make an independent copy<small>The other lights keep their appearance</small>','sharedOne')}${button('Back','scene')}</div><p class="mocknote">Proposed decision screen. Resource allocation is not implemented in this prototype.</p></div>`,project.name);return;}
 const item=current();let panel='';
 if(screen==='add'){panel=`<h2>Add to your game</h2><div class="stack">${button('Draw a sprite<small>Start with your own pixels</small>','drawNew','class="primary"')}${button('Star<small>Illustrated resource for this study</small>','addStar')}${button('Light<small>A piece for a board</small>','addLight')}${button('Back','scene')}</div>`;}
 else if(screen==='tools'){panel=`<h2>Tools</h2><div class="stack">${button('Sprites & animation','tool:Sprites & animation')}${button('Map & backgrounds','tool:Map & backgrounds')}${button('Rules & state','tool:Rules & state')}${button('Sound & music','tool:Sound & music')}${button('Library & favourites','tool:Library & favourites')}${button('Code & help','tool:Code & help')}${button('Back','scene')}</div>`;}
 else if(screen.startsWith('tool:')){panel=`<h2>${esc(screen.slice(5))}</h2><p class="desc">Available from every project in the proposed workshop. This tool is outside the interactive scope of this study.</p>${button('Back to tools','tools')}`;}
 else if(screen==='sound'){panel=`<h2>Sound on this event</h2><p class="desc">Choose a sound here, or create one and return to this rule.</p><div class="stack">${button('Soft chime<small>Assign a named sound</small>','soundAssign')}${button('Create a sound','tool:Sound & music')}${button('Back','scene')}</div><p class="mocknote">No sound playback in this study.</p>`;}
 else if(screen==='move'){panel=`<h2>Place ${esc(item.name)}</h2><p class="desc">Directions move this element. The rest of your game stays put.</p><div class="controls">${button('←','move:-4,0')}${button('↑','move:0,-4')}${button('↓','move:0,4')}${button('→','move:4,0')}</div><div class="row">${button('Cancel','moveCancel')}${button('Done','moveDone','class="primary"')}</div>`;}
 else if(screen==='test'){panel=`<div class="tag">SIMULATED TEST</div><h2>${testing.won?'You did it!':'Try your changes'}</h2><p class="desc">${project.kind==='puzzle'?'Choose a light and toggle it.':project.movement?'Move towards the star.':'Add movement or a rule to make this interactive.'}</p><div class="controls">${button('←','play:left')}${button('↑','play:up')}${button('↓','play:down')}${button('→','play:right')}</div>${project.kind==='puzzle'?button('○ Toggle light','play:toggle','class="primary"'):''}<div class="stack">${button('Restart','restart')}${button('Return to editing','return','class="primary"')}</div><p class="mocknote">Browser simulation only. The Android Test will use official PICO-8.</p>`;}
 else {panel=item?`<div class="tag">SELECTED ELEMENT</div><h2>${esc(item.name)}</h2><div class="desc">${item.type==='light'?'A light in your puzzle':item.type==='star'?'An item in your game':'Your image in the game'}</div><div class="stack">${button('Appearance<small>Sprite and animation</small>','appearance')}${button('Move','move')}${button('Behavior<small>'+((item.id===project.moverId&&project.movement)?'Moves with directions':'Add a way to act')+'</small>','behavior')}${button('Rules<small>'+(project.rules?'See what makes things happen':'Connect an event and an action')+'</small>','rules')}${button('Sound','sound')}${button('Duplicate','duplicate')}</div>`:`<h2>An empty game</h2><p class="desc">Add a sprite, draw something, and put it where you want.</p>${button('Add your first element','add','class="primary"')}`;}
 const displayProject=screen==='test'?testing.snapshot:project;
 shell(`<div class="work"><section class="stage" aria-label="Game view"><div class="canvas-wrap"><canvas id="game" class="game" width="128" height="128" aria-label="${project.kind==='puzzle'?'Three selectable lights on a board':'Game composition; choose elements below'}"></canvas></div><div class="scene-note"><span>${screen==='test'?'Simulation · sound off':'Game view · starting composition'}</span><span>${screen==='move'?'PLACING':screen==='test'?'TEST':'SELECT'}</span></div>${screen==='test'?'':`<div class="elements" aria-label="Elements">${project.items.map(i=>button(esc(i.name),'select:'+i.id,`class="${selected===i.id?'chosen':''}" aria-pressed="${selected===i.id}"`)).join('')}</div><div class="quick">${button('+ Add','add')}${button('Tools','tools')}${button('▶ Test','test','class="primary"')}</div>`}</section><section class="panel">${panel}</section></div>${screen==='scene'?`<div class="quick">${button('Undo','undo',history.length?'':'disabled')}${button('New project','home')}</div>`:''}`,project.name);drawScene(document.getElementById('game'),displayProject,selected,screen==='test'?testing:null);
}
function snapshot(){
 const p=clone(project);
 if(draft?.pixels&&!draft.add){const chosen=p.items.find(i=>i.id===selected);p.items.filter(i=>i.id===selected||(draft.shared&&i.group&&i.group===chosen.group)).forEach(i=>i.pixels=clone(draft.pixels));}
 if(draft?.speed){p.speed=draft.speed;p.movement=true;p.moverId=selected;}
 if(draft?.rule){p.rules=true;p.collectId=selected;p.targetId=draft.target;}
 return p;
}
function startTest(){
 if(!project)return;
 if(draft?.add){notice='Finish the new sprite before testing it in this study.';render();return;}
 if(draft?.rule&&project.kind!=='puzzle'&&!draft.target){notice='Choose another element before testing this overlap rule.';render();return;}
 backScreen=screen;const p=snapshot();screen='test';const mover=p.items.find(i=>i.id===p.moverId);
 testing={snapshot:p,x:mover?.x??64,y:mover?.y??64,index:0,lights:p.items.map(i=>!!i.on),collected:false,won:false};notice='Simulation does not write to your game.';render();
}
function play(direction){
 const p=testing.snapshot;
 if(p.kind==='puzzle'){
  if(direction==='left')testing.index=(testing.index+p.items.length-1)%p.items.length;
  if(direction==='right')testing.index=(testing.index+1)%p.items.length;
  if(direction==='toggle'&&p.rules)testing.lights[testing.index]=!testing.lights[testing.index];
  testing.won=p.rules&&testing.lights.every(Boolean);
 }else if(p.movement&&!testing.won){
  const delta=p.speed*3;if(direction==='left')testing.x-=delta;if(direction==='right')testing.x+=delta;if(direction==='up')testing.y-=delta;if(direction==='down')testing.y+=delta;
  testing.x=Math.max(4,Math.min(124,testing.x));testing.y=Math.max(4,Math.min(124,testing.y));
  const pos=id=>id===p.moverId?{x:testing.x,y:testing.y}:p.items.find(i=>i.id===id);
  const a=pos(p.collectId),b=pos(p.targetId);
  if(p.rules&&a&&b&&Math.abs(a.x-b.x)<9&&Math.abs(a.y-b.y)<9){testing.won=true;testing.collected=true;}
 }render();
}
function beginPaint(add=false,shared=false){draft={add,shared,pixels:add?Array(8).fill('........'):clone(current().pixels)};screen='paint';render();}
function dispatch(action){
 if(action.startsWith('new:'))return fresh(action.slice(4));
 if(action.startsWith('select:')){selected=+action.slice(7);screen='scene';notice='';}
 else if(action.startsWith('color:')){paintColor=action.slice(6);}
 else if(action==='home'){project=null;selected=null;draft=null;history=[];notice='';screen='home';}
 else if(action==='drawNew')return beginPaint(true);
 else if(action==='appearance'){if(current().group&&project.items.filter(i=>i.group===current().group).length>1){screen='conflict';}else return beginPaint();}
 else if(action==='sharedAll')return beginPaint(false,true);
 else if(action==='sharedOne')return beginPaint(false,false);
 else if(action==='paintDone'){save('Appearance updated');if(draft.add){let id=Math.max(0,...project.items.map(i=>i.id))+1;project.items.push({id,name:'Sprite '+id,type:'custom',x:64,y:64,pixels:clone(draft.pixels)});selected=id;}else if(draft.shared){project.items.filter(i=>i.group===current().group).forEach(i=>i.pixels=clone(draft.pixels));}else {current().pixels=clone(draft.pixels);current().group=null;}draft=null;screen='scene';}
 else if(action==='behavior'){draft={speed:project.speed};screen='behavior';}
 else if(action==='behaviorDone'){save('Movement added');project.movement=true;project.moverId=selected;project.speed=draft.speed;draft=null;screen='scene';}
 else if(action==='rules'){draft={rule:true,target:project.targetId!==selected&&project.items.some(i=>i.id===project.targetId)?project.targetId:project.items.find(i=>i.id!==selected)?.id};screen='rules';}
 else if(action==='ruleDone'){save('Rule connected');project.rules=true;project.collectId=selected;project.targetId=draft.target;draft=null;screen='scene';}
 else if(action==='cancel'){draft=null;screen='scene';notice='Draft cancelled. Your game is unchanged.';}
 else if(action==='soundAssign'){save('Soft chime assigned in the demo');project.sound=true;screen='scene';}
 else if(action==='addStar'||action==='addLight'){save('Element added');let light=action==='addLight',id=Math.max(0,...project.items.map(i=>i.id))+1;project.items.push({id,name:(light?'Light ':'Star ')+id,type:light?'light':'star',x:64,y:64,pixels:clone(light?art.light:art.star),on:false});selected=id;screen='scene';}
 else if(action==='duplicate'){save('Element duplicated');let it=clone(current());it.id=Math.max(...project.items.map(i=>i.id))+1;it.name+=' copy';it.x=Math.min(120,it.x+12);project.items.push(it);selected=it.id;}
 else if(action==='move'){moveOrigin=clone(project);screen='move';}
 else if(action.startsWith('move:')){let [x,y]=action.slice(5).split(',').map(Number);current().x=Math.max(4,Math.min(124,current().x+x));current().y=Math.max(4,Math.min(124,current().y+y));}
 else if(action==='moveCancel'){project=moveOrigin;moveOrigin=null;screen='scene';notice='Placement cancelled.';}
 else if(action==='moveDone'){history.push(moveOrigin);moveOrigin=null;screen='scene';notice='Element moved · Undo available';}
 else if(action==='undo'){if(history.length){project=history.pop();selected=project.items.find(i=>i.id===selected)?.id??project.items[0]?.id??null;notice='Last completed change undone.';}}
 else if(action==='test')return startTest();
 else if(action==='restart'){const prev=backScreen;startTest();backScreen=prev;return;}
 else if(action==='return'){screen=backScreen;testing=null;notice='Back to the same edit. Your starting layout is unchanged.';}
 else if(action.startsWith('play:'))return play(action.slice(5));
 else {screen=action;notice='';}
 render();
}
function wire(){app.querySelectorAll('[data-action]').forEach(b=>b.addEventListener('click',()=>dispatch(b.dataset.action)));app.querySelectorAll('[data-pixel]').forEach(b=>b.addEventListener('click',()=>{let[x,y]=b.dataset.pixel.split(',').map(Number),r=[...draft.pixels[y]];r[x]=paintColor;draft.pixels[y]=r.join('');b.style.background=C[paintColor];}));const target=document.getElementById('target');if(target)target.addEventListener('change',()=>{draft.target=+target.value;});let speed=document.getElementById('speed');if(speed)speed.addEventListener('input',()=>{draft.speed=+speed.value;document.getElementById('speedValue').textContent=['','Slow','Steady','Quick','Very quick'][draft.speed];});const canvas=document.getElementById('game');if(canvas)canvas.addEventListener('click',e=>{if(screen!=='scene')return;let r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*128/r.width,y=(e.clientY-r.top)*128/r.height;let it=[...project.items].reverse().find(i=>Math.abs(i.x-x)<10&&Math.abs(i.y-y)<10);if(it)dispatch('select:'+it.id);});}
document.addEventListener('keydown',e=>{if(e.key==='F5'&&project){e.preventDefault();if(screen!=='test')startTest();return;}if(e.key==='Escape'){e.preventDefault();if(screen==='test')dispatch('return');else if(screen==='move')dispatch('moveCancel');else if(draft)dispatch('cancel');else if(screen==='scene')dispatch('home');else if(screen!=='home')dispatch('scene');return;}if(e.key.toLowerCase()==='u'&&screen==='scene'){dispatch('undo');return;}const dirs={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down'};if(screen==='test'){if(dirs[e.key]){e.preventDefault();play(dirs[e.key]);}else if((e.key===' '||e.key.toLowerCase()==='z')&&!e.repeat){e.preventDefault();play('toggle');}return;}if(screen==='move'&&dirs[e.key]){e.preventDefault();dispatch('move:'+({left:'-4,0',right:'4,0',up:'0,-4',down:'0,4'}[dirs[e.key]]));return;}if(dirs[e.key]&&!['SELECT','INPUT'].includes(document.activeElement.tagName)){e.preventDefault();let all=[...app.querySelectorAll('button:not([disabled])')],active=document.activeElement,i=all.indexOf(active),step=e.key==='ArrowUp'?-1:e.key==='ArrowLeft'?-1:1;if(active.dataset.pixel&&['ArrowUp','ArrowDown'].includes(e.key))step=e.key==='ArrowUp'?-8:8;all[(i+step+all.length)%all.length]?.focus();}});
const view=new URLSearchParams(location.search).get('view');if(view&&view!=='home'){fresh(view==='blank'?'blank':view==='puzzle'?'puzzle':'explorer');if(view==='rules'){selected=2;dispatch('rules');}if(view==='appearance')dispatch('appearance');if(view==='conflict'){fresh('puzzle');dispatch('appearance');}}else render();
})();
</script>
